pre-commit:
  jobs:
    - name: ultracite
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css,html,md,mdx}"
      run: bunx ultracite fix {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: rust-tests
      run: bun run test:rust
    - name: bindings
      run: bun run check:bindings
    - name: typecheck
      run: bun run typecheck
    - name: check
      run: bun run check
